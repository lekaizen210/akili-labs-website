services:
  nginx:
    image: nginx:1.27-alpine
    container_name: akili-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      akili-website:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    networks:
      - public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "com.akililabs.service=nginx"

  akili-website:
    image: ghcr.io/${GHCR_OWNER:-akililabs}/akili-labs-website:${VERSION:-latest}
    container_name: akili-labs-website
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Chat IA multi-agents — cf. Stack technique §9
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ORCHESTRATOR_MODEL=${ORCHESTRATOR_MODEL:-claude-haiku-4-5-20251001}
      - SPECIALIST_MODEL_FAQ=${SPECIALIST_MODEL_FAQ:-claude-sonnet-5}
      - SPECIALIST_MODEL_QUALIFICATION=${SPECIALIST_MODEL_QUALIFICATION:-claude-sonnet-5}
      - SPECIALIST_MODEL_SUPPORT=${SPECIALIST_MODEL_SUPPORT:-claude-haiku-4-5-20251001}
      # Qualification de lead (Lot 3) — webhook Odoo + fallback email
      - ODOO_WEBHOOK_URL=${ODOO_WEBHOOK_URL:-}
      - ODOO_WEBHOOK_TOKEN=${ODOO_WEBHOOK_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - SALES_FALLBACK_EMAIL=${SALES_FALLBACK_EMAIL:-contact@akililabs.io}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - public
      - internal
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "com.akililabs.service=website"
      - "com.akililabs.version=${VERSION:-latest}"

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  nginx-logs:
    driver: local
