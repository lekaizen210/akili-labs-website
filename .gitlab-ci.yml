# ============================================================
# GitLab CI/CD — AKILI Labs Website
# Registry : GitLab Container Registry (CI_REGISTRY_IMAGE auto)
# Stages : validate → build → deploy
# ============================================================

image: node:20-alpine

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  NEXT_TELEMETRY_DISABLED: "1"
  # Image de base dans le GitLab Registry
  APP_IMAGE: $CI_REGISTRY_IMAGE

# ──────────────────────────────────────────────────────────────
# Cache npm entre les jobs
# ──────────────────────────────────────────────────────────────
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull-push

# ──────────────────────────────────────────────────────────────
# Stages
# ──────────────────────────────────────────────────────────────
stages:
  - validate
  - build
  - deploy

# ──────────────────────────────────────────────────────────────
# STAGE 1 : Validate
# ──────────────────────────────────────────────────────────────
lint:
  stage: validate
  script:
    - npm ci --prefer-offline
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v/'

typecheck:
  stage: validate
  script:
    - npm ci --prefer-offline
    - npx tsc --noEmit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v/'

build-check:
  stage: validate
  script:
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ──────────────────────────────────────────────────────────────
# STAGE 2 : Build Docker Image
# ──────────────────────────────────────────────────────────────
.docker-build-base: &docker-build-base
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build-preprod:
  <<: *docker-build-base
  script:
    - |
      TAG="preprod-${CI_COMMIT_SHORT_SHA}"
      docker build \
        --cache-from $APP_IMAGE:preprod-latest \
        --tag $APP_IMAGE:$TAG \
        --tag $APP_IMAGE:preprod-latest \
        .
      docker push $APP_IMAGE:$TAG
      docker push $APP_IMAGE:preprod-latest
      echo "IMAGE_TAG=$TAG" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      needs:
        - lint
        - typecheck
        - build-check

build-prod:
  <<: *docker-build-base
  script:
    - |
      VERSION="${CI_COMMIT_TAG}"
      docker build \
        --cache-from $APP_IMAGE:latest \
        --tag $APP_IMAGE:$VERSION \
        --tag $APP_IMAGE:latest \
        .
      docker push $APP_IMAGE:$VERSION
      docker push $APP_IMAGE:latest
      echo "IMAGE_TAG=$VERSION" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      needs:
        - lint
        - typecheck
        - build-check

# ──────────────────────────────────────────────────────────────
# STAGE 3 : Deploy
# ──────────────────────────────────────────────────────────────
deploy-preprod:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build-preprod
      artifacts: true
  environment:
    name: preprod
    url: https://test.akililabs.io
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PREPROD_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $PREPROD_HOST >> ~/.ssh/known_hosts
  script:
    - |
      # Copier les fichiers de déploiement
      scp -P ${PREPROD_PORT:-22} \
        docker-compose.prod.yml \
        $PREPROD_USER@$PREPROD_HOST:/opt/akili-preprod/

      # Déployer via SSH
      ssh -p ${PREPROD_PORT:-22} $PREPROD_USER@$PREPROD_HOST "
        set -e
        cd /opt/akili-preprod

        # Login GitLab Registry
        docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

        export VERSION=$IMAGE_TAG
        export DOMAIN=test.akililabs.io

        docker pull $APP_IMAGE:\${VERSION}
        docker compose -f docker-compose.prod.yml up -d --no-build --pull never
        docker image prune -f
        echo '✅ Preprod déployée : '\$VERSION
      "
    - |
      # Healthcheck
      sleep 20
      HTTP=$(wget -qO- --server-response https://test.akililabs.io/ 2>&1 | \
        awk '/^  HTTP/{print $2}' | tail -1 || echo "000")
      echo "HTTP: $HTTP"
      [ "$HTTP" = "200" ] || (echo "❌ Healthcheck échoué" && exit 1)
      echo "✅ Preprod opérationnelle."
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-prod:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build-prod
      artifacts: true
  environment:
    name: production
    url: https://akililabs.io
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - |
      # Copier les fichiers de déploiement
      scp -P ${VPS_PORT:-22} \
        docker-compose.prod.yml \
        $VPS_USER@$VPS_HOST:/opt/akili-website/

      # Déployer via SSH
      ssh -p ${VPS_PORT:-22} $VPS_USER@$VPS_HOST "
        set -e
        cd /opt/akili-website

        docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

        export VERSION=$IMAGE_TAG
        export DOMAIN=akililabs.io

        docker pull $APP_IMAGE:\${VERSION}
        docker compose -f docker-compose.prod.yml up -d --no-build --pull never
        docker image prune -f
        echo '✅ Production déployée : '\$VERSION
      "
    - |
      sleep 20
      HTTP=$(wget -qO- --server-response https://akililabs.io/ 2>&1 | \
        awk '/^  HTTP/{print $2}' | tail -1 || echo "000")
      echo "HTTP: $HTTP"
      [ "$HTTP" = "200" ] || (echo "❌ Healthcheck production échoué" && exit 1)
      echo "✅ Production opérationnelle."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  when: manual
  allow_failure: false
