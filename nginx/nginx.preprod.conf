# Nginx — Configuration Préproduction (HTTP only, sans TLS)
# À remplacer par nginx.conf une fois les certificats Let's Encrypt obtenus

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Sécurité : masquer la version
    server_tokens off;

    # Performances
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=forms:10m rate=5r/s;

    # Upstream Next.js
    upstream nextjs {
        server akili-website:3000;
        keepalive 16;
    }

    # ── Serveur HTTP preprod ──────────────────────────────────────
    server {
        listen 80 default_server;
        server_name preprod.akililabs.com _;

        # Healthcheck interne
        location /healthz {
            access_log off;
            return 200 "preprod-ok\n";
            add_header Content-Type text/plain;
        }

        # Assets statiques Next.js — cache long
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=31536000, immutable";
            proxy_cache_valid 200 365d;
        }

        # Images optimisées Next.js
        location /_next/image {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=604800";
        }

        # Formulaires — rate limit strict
        location ~ ^/(contact|carrieres) {
            limit_req zone=forms burst=10 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Toutes les autres routes
        location / {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;

            # Headers de sécurité de base
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;

            # Bannière preprod
            add_header X-Environment "preprod" always;
        }
    }
}
