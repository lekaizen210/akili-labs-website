worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Masquer la version Nginx
    server_tokens off;

    # Logging format structuré
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Rate limiting — zones partagées
    # Zone générale : 30 req/s par IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    # Zone formulaires (contact, carrières) : 5 req/s par IP
    limit_req_zone $binary_remote_addr zone=forms:10m rate=5r/s;

    # Cache des réponses upstream
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=nextjs_cache:10m
                     max_size=100m inactive=60m use_temp_path=off;

    # Upstream Next.js
    upstream nextjs {
        server akili-website:3000;
        keepalive 32;
    }

    # ─────────────────────────────────────────────
    # Redirection HTTP → HTTPS
    # ─────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name akililabs.io www.akililabs.io akililabs.com www.akililabs.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────
    # Redirections vers le domaine canonique akililabs.io
    # (ancien domaine .com + sous-domaine www)
    # ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name akililabs.com www.akililabs.com;

        ssl_certificate     /etc/letsencrypt/live/akililabs.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/akililabs.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://akililabs.io$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.akililabs.io;

        ssl_certificate     /etc/letsencrypt/live/akililabs.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/akililabs.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://akililabs.io$request_uri;
    }

    # ─────────────────────────────────────────────
    # Serveur HTTPS principal
    # ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name akililabs.io;

        # TLS
        ssl_certificate     /etc/letsencrypt/live/akililabs.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/akililabs.io/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;

        # Protocoles et ciphers modernes uniquement (TLS 1.2 + 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ── En-têtes de sécurité ─────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;

        # ── Healthcheck interne Nginx ────────────
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Assets statiques Next.js (cache agressif) ──
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_cache nextjs_cache;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            access_log off;
        }

        # ── Images optimisées Next.js ────────────
        location /_next/image {
            proxy_pass http://nextjs;
            proxy_cache nextjs_cache;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ── Fichiers publics (favicon, robots, sitemap…) ──
        location ~* \.(ico|png|jpg|jpeg|svg|webp|avif|gif|woff2?|ttf|eot)$ {
            proxy_pass http://nextjs;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ── Formulaires — rate limit strict ─────
        location ~ ^/(contact|carrieres) {
            limit_req zone=forms burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://nextjs;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Route principale ─────────────────────
        location / {
            limit_req zone=general burst=60 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # Pas de cache pour les pages SSR/SSG dynamiques
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
