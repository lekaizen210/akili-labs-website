name: Deploy — Production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de version (ex: v1.2.0)"
        required: true
        default: "v1.0.0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/akili-labs-website

jobs:
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  build:
    name: Build Docker Image (production)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    environment:
      name: production
      url: https://akililabs.io

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + nginx to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,nginx/"
          target: "/opt/akili-website/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/akili-website
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export VERSION=${{ needs.build.outputs.version }}
            export GHCR_OWNER=${{ github.repository_owner }}
            export DOMAIN=akililabs.io
            export ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
            export ODOO_WEBHOOK_URL="${{ secrets.ODOO_WEBHOOK_URL }}"
            export ODOO_WEBHOOK_TOKEN="${{ secrets.ODOO_WEBHOOK_TOKEN }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export RESEND_FROM_EMAIL="${{ secrets.RESEND_FROM_EMAIL }}"

            docker pull ${{ needs.build.outputs.image }}:${VERSION}
            docker compose -f docker-compose.prod.yml pull --ignore-pull-failures nginx
            docker compose -f docker-compose.prod.yml up -d --no-build --pull missing

            # docker compose up ne détecte pas les changements de CONTENU d'un fichier
            # monté en volume (seulement les changements de définition du service) —
            # sans ce reload explicite, nginx continue de servir l'ancienne config.
            docker exec akili-nginx nginx -s reload

            docker image prune -f
            echo "✅ Production déployée : v${VERSION}"

      - name: Healthcheck production
        run: |
          sleep 20
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            https://akililabs.io/ --max-time 15 || echo "000")
          echo "HTTP: $HTTP"
          [ "$HTTP" = "200" ] || (echo "❌ Healthcheck échoué" && exit 1)
          echo "✅ Production opérationnelle."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          body: |
            ## Déploiement AKILI Labs Website

            **Image Docker :** `${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}`
            **Déployé sur :** https://akililabs.io
