name: Deploy — Preprod

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/akili-labs-website
  PREPROD_DOMAIN: test.akililabs.io

jobs:
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  build:
    name: Build Docker Image (preprod)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=preprod-${{ github.sha }}
            type=raw,value=preprod-latest

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-preprod:
    name: Deploy to Preprod VPS
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: preprod
      url: https://test.akililabs.io

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to Preprod VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.PREPROD_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/"
          target: "/opt/akili-preprod/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.PREPROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/akili-preprod

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export VERSION=preprod-${{ github.sha }}
            export DOMAIN=${{ env.PREPROD_DOMAIN }}
            export GHCR_OWNER=${{ github.repository_owner }}

            # Copier la config preprod (HTTPS + test.akililabs.io)
            cp nginx/nginx.preprod.conf nginx/nginx.conf

            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${VERSION}
            docker compose -f docker-compose.prod.yml pull --ignore-pull-failures nginx
            docker compose -f docker-compose.prod.yml up -d --no-build --pull missing
            docker image prune -f
            echo "✅ Preprod déployée : ${VERSION} sur https://${{ env.PREPROD_DOMAIN }}"

      - name: Healthcheck preprod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.PREPROD_SSH_KEY }}
          script: |
            sleep 30

            # Vérifier que Next.js est healthy
            WEB_STATUS=$(docker inspect akili-labs-website \
              --format "{{.State.Health.Status}}" 2>/dev/null || echo "absent")
            echo "Next.js : $WEB_STATUS"
            [ "$WEB_STATUS" = "healthy" ] || (echo "❌ Next.js unhealthy" && exit 1)

            # Vérifier que nginx répond en HTTPS sur /healthz
            NGINX_HTTPS=$(docker exec akili-nginx \
              wget -qO- https://localhost/healthz --no-check-certificate 2>/dev/null || echo "")
            echo "Nginx HTTPS /healthz : '$NGINX_HTTPS'"
            echo "$NGINX_HTTPS" | grep -q "preprod-ok" || (echo "❌ Nginx KO" && exit 1)

            echo "✅ Preprod opérationnelle (Next.js: $WEB_STATUS, Nginx HTTPS: OK)"
            echo "🌐 https://${{ env.PREPROD_DOMAIN }}"
