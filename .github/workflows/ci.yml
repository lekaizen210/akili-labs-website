name: CI — Lint & TypeCheck

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint (core-web-vitals)
        run: npm run lint

      - name: TypeScript (noEmit)
        run: npx tsc --noEmit

      - name: Next.js build check
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
