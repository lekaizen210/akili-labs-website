name: Build & Deploy — AKILI Labs Website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (ex: 1.2.0)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/akili-labs-website

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & Push image vers GHCR
  # ──────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 2. Déploiement sur VPS via SSH
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout (pour les fichiers compose + nginx)
        uses: actions/checkout@v4

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,nginx/"
          target: "/opt/akili-website/"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd /opt/akili-website

            # Authentification GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Mise à jour de la variable VERSION
            export VERSION=${{ needs.build.outputs.version }}
            export GHCR_OWNER=${{ github.repository_owner }}
            export ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
            export ODOO_WEBHOOK_URL="${{ secrets.ODOO_WEBHOOK_URL }}"
            export ODOO_WEBHOOK_TOKEN="${{ secrets.ODOO_WEBHOOK_TOKEN }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export RESEND_FROM_EMAIL="${{ secrets.RESEND_FROM_EMAIL }}"

            # Pull de la nouvelle image
            docker pull ${{ needs.build.outputs.image }}:${VERSION}

            # Rechargement sans coupure (rolling restart)
            docker compose -f docker-compose.prod.yml up -d --no-build --pull never

            # docker compose up ne détecte pas les changements de CONTENU d'un fichier
            # monté en volume (seulement les changements de définition du service) —
            # sans ce reload explicite, nginx continue de servir l'ancienne config.
            docker exec akili-nginx nginx -s reload

            # Nettoyage des images obsolètes
            docker image prune -f

            echo "✅ Déploiement $VERSION terminé avec succès."

      - name: Healthcheck post-déploiement
        run: |
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --resolve akililabs.io:443:${{ secrets.VPS_HOST }} \
            https://akililabs.io/ \
            --max-time 15 2>/dev/null || echo "000")
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Healthcheck échoué (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Site répond correctement."
